<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LuaForge — GitHub Uploader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #08090d;
      --panel: rgba(18, 20, 28, 0.82);
      --border: rgba(255,255,255,0.09);
      --text: #f5f7fb;
      --muted: #9298a8;
      --accent: #7c5cff;
      --accent2: #9d87ff;
      --success: #39d98a;
      --danger: #ff5c70;
    }

    body {
      min-height: 100vh;
      padding: 32px 18px;

      color: var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(124,92,255,0.16),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(74,144,226,0.10),
          transparent 30%
        ),
        var(--bg);
    }

    .container {
      width: min(1100px, 100%);
      margin: auto;
    }

    /* HEADER */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .logo {
      width: 44px;
      height: 44px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #4f3dbb
        );

      box-shadow:
        0 10px 35px
        rgba(124,92,255,0.25);

      font-weight: 900;
    }

    .brand h1 {
      font-size: 20px;
    }

    .brand p {
      margin-top: 3px;

      color: var(--muted);
      font-size: 12px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 8px 12px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: rgba(255,255,255,0.035);

      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--success);

      box-shadow:
        0 0 12px
        rgba(57,217,138,0.8);
    }

    /* PANEL */

    .panel {
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 22px;

      background: var(--panel);

      backdrop-filter: blur(18px);

      box-shadow:
        0 30px 80px rgba(0,0,0,0.35);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 22px 24px;

      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-size: 15px;
      font-weight: 750;
    }

    .panel-subtitle {
      margin-top: 5px;

      color: var(--muted);
      font-size: 12px;
    }

    .language {
      padding: 7px 11px;

      border: 1px solid
        rgba(124,92,255,0.18);

      border-radius: 8px;

      background:
        rgba(124,92,255,0.10);

      color: var(--accent2);

      font-size: 11px;
      font-weight: 750;
    }

    /* EDITOR */

    .editor-wrap {
      padding: 20px;
    }

    textarea {
      width: 100%;
      min-height: 430px;

      padding: 20px;

      resize: vertical;

      outline: none;

      border: 1px solid
        rgba(255,255,255,0.08);

      border-radius: 15px;

      background:
        rgba(5,6,10,0.94);

      color: #e8eaff;

      font-family:
        "JetBrains Mono",
        "Fira Code",
        Consolas,
        monospace;

      font-size: 13px;
      line-height: 1.7;

      transition:
        border-color .2s,
        box-shadow .2s;
    }

    textarea:focus {
      border-color:
        rgba(124,92,255,0.55);

      box-shadow:
        0 0 0 4px
        rgba(124,92,255,0.08);
    }

    textarea::placeholder {
      color: #555b6c;
    }

    /* INFO */

    .info {
      display: grid;
      grid-template-columns: repeat(2,1fr);

      gap: 12px;

      margin-top: 14px;
    }

    .info-card {
      padding: 15px;

      border: 1px solid
        rgba(255,255,255,0.07);

      border-radius: 13px;

      background:
        rgba(255,255,255,0.025);
    }

    .info-title {
      margin-bottom: 7px;

      color: #d9dce7;

      font-size: 12px;
      font-weight: 750;
    }

    .info-value {
      color: var(--muted);
      font-size: 12px;
    }

    /* ACTIONS */

    .actions {
      display: flex;
      gap: 10px;

      margin-top: 18px;
    }

    button {
      padding: 13px 19px;

      border: 0;
      border-radius: 12px;

      cursor: pointer;

      font-size: 13px;
      font-weight: 750;

      transition:
        transform .15s,
        opacity .15s,
        box-shadow .15s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
      transform: none;
    }

    .convert-btn {
      flex: 1;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #5f48db
        );

      box-shadow:
        0 12px 28px
        rgba(124,92,255,0.22);
    }

    .clear-btn {
      color: #d5d8e2;

      background:
        rgba(255,255,255,0.06);

      border: 1px solid
        rgba(255,255,255,0.08);
    }

    /* MESSAGE */

    .message {
      margin-top: 15px;

      padding: 12px 14px;

      border-radius: 11px;

      font-size: 12px;
      line-height: 1.5;
    }

    .message.success {
      color: #bdeed4;

      background:
        rgba(57,217,138,0.06);

      border: 1px solid
        rgba(57,217,138,0.14);
    }

    .message.error {
      color: #ffc0c8;

      background:
        rgba(255,92,112,0.06);

      border: 1px solid
        rgba(255,92,112,0.14);
    }

    /* RESULT */

    .result {
      margin-top: 18px;

      padding: 18px;

      border-radius: 15px;

      background:
        rgba(57,217,138,0.045);

      border: 1px solid
        rgba(57,217,138,0.12);
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 12px;
    }

    .result-title {
      font-size: 12px;
      font-weight: 750;
    }

    .copy-btn {
      padding: 8px 12px;

      color: #e7e9f0;

      background:
        rgba(255,255,255,0.07);

      border: 1px solid
        rgba(255,255,255,0.08);

      font-size: 11px;
    }

    .result-code {
      overflow-x: auto;

      padding: 14px;

      border-radius: 10px;

      background:
        rgba(0,0,0,0.28);

      color: #bdeed4;

      font-family:
        "JetBrains Mono",
        "Fira Code",
        Consolas,
        monospace;

      font-size: 12px;
      line-height: 1.6;

      white-space: pre-wrap;
      word-break: break-all;
    }

    .raw-link {
      display: block;

      margin-top: 10px;

      color: var(--accent2);

      font-size: 11px;

      word-break: break-all;
    }

    .hidden {
      display: none;
    }

    footer {
      margin-top: 18px;

      text-align: center;

      color: #626878;

      font-size: 11px;
    }

    @media (max-width: 700px) {

      body {
        padding: 18px 12px;
      }

      .status {
        display: none;
      }

      .panel-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .info {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }

      .convert-btn {
        flex: none;
      }

      textarea {
        min-height: 330px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>

    <div class="brand">

      <div class="logo">
        LF
      </div>

      <div>
        <h1>LuaForge</h1>

        <p>
          GitHub Lua/Luau uploader
        </p>
      </div>

    </div>

    <div class="status">
      <span class="status-dot"></span>
      Backend ready
    </div>

  </header>


  <main class="panel">

    <div class="panel-header">

      <div>
        <div class="panel-title">
          Source Code
        </div>

        <div class="panel-subtitle">
          Paste your Lua/Luau source code below.
        </div>
      </div>

      <div class="language">
        LUA / LUAU
      </div>

    </div>


    <div class="editor-wrap">

      <textarea
        id="codeInput"
        spellcheck="false"
        placeholder="-- Paste your Lua / Luau code here...

print(&quot;Hello, World!&quot;)
"></textarea>


      <div class="info">

        <div class="info-card">

          <div class="info-title">
            Upload
          </div>

          <div class="info-value">
            GitHub repository
          </div>

        </div>


        <div class="info-card">

          <div class="info-title">
            Filename
          </div>

          <div class="info-value">
            Automatically generated
          </div>

        </div>

      </div>


      <div class="actions">

        <button
          class="convert-btn"
          id="convertButton"
        >
          Convert & Upload
        </button>

        <button
          class="clear-btn"
          id="clearButton"
        >
          Clear
        </button>

      </div>


      <div
        id="message"
        class="message hidden"
      ></div>


      <div
        id="resultBox"
        class="result hidden"
      >

        <div class="result-head">

          <div class="result-title">
            Generated Loadstring
          </div>

          <button
            class="copy-btn"
            id="copyButton"
          >
            Copy
          </button>

        </div>


        <div
          id="resultCode"
          class="result-code"
        ></div>


        <a
          id="rawLink"
          class="raw-link"
          target="_blank"
          rel="noopener noreferrer"
        ></a>

      </div>

    </div>

  </main>


  <footer>
    LuaForge · GitHub-powered source uploader
  </footer>

</div>


<script>

  const API_URL =
    "https://loadgene.vanzmodeonaktif.workers.dev/upload";


  const codeInput =
    document.getElementById("codeInput");

  const convertButton =
    document.getElementById("convertButton");

  const clearButton =
    document.getElementById("clearButton");

  const copyButton =
    document.getElementById("copyButton");

  const resultBox =
    document.getElementById("resultBox");

  const resultCode =
    document.getElementById("resultCode");

  const rawLink =
    document.getElementById("rawLink");

  const message =
    document.getElementById("message");


  // ========================================
  // MESSAGE
  // ========================================

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      `message ${type}`;

  }


  function hideMessage() {

    message.className =
      "message hidden";

    message.textContent = "";

  }


  // ========================================
  // CONVERT + UPLOAD
  // ========================================

  convertButton.addEventListener(
    "click",
    async () => {

      const code =
        codeInput.value;

      if (!code.trim()) {

        showMessage(
          "Masukkan kode Lua/Luau terlebih dahulu.",
          "error"
        );

        codeInput.focus();

        return;
      }


      convertButton.disabled = true;

      convertButton.textContent =
        "Uploading...";

      resultBox.classList.add("hidden");

      hideMessage();


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                code
              })
            }
          );


        let data;

        try {

          data =
            await response.json();

        } catch {

          throw new Error(
            "Backend mengirim response yang tidak valid."
          );

        }


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.error ||
            "Upload gagal."
          );

        }


        // Show result

        resultCode.textContent =
          data.loadstring;

        rawLink.href =
          data.rawUrl;

        rawLink.textContent =
          data.rawUrl;

        resultBox.classList.remove(
          "hidden"
        );


        showMessage(
          `Upload berhasil: ${data.filename}`,
          "success"
        );

      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Terjadi kesalahan saat upload.",
          "error"
        );

      } finally {

        convertButton.disabled = false;

        convertButton.textContent =
          "Convert & Upload";

      }

    }
  );


  // ========================================
  // COPY
  // ========================================

  copyButton.addEventListener(
    "click",
    async () => {

      const text =
        resultCode.textContent;

      if (!text) {
        return;
      }


      try {

        await navigator.clipboard.writeText(
          text
        );

        copyButton.textContent =
          "Copied!";

        setTimeout(() => {

          copyButton.textContent =
            "Copy";

        }, 1500);

      } catch {

        showMessage(
          "Clipboard tidak tersedia di browser ini.",
          "error"
        );

      }

    }
  );


  // ========================================
  // CLEAR
  // ========================================

  clearButton.addEventListener(
    "click",
    () => {

      codeInput.value = "";

      resultCode.textContent = "";

      rawLink.textContent = "";

      rawLink.removeAttribute("href");

      resultBox.classList.add(
        "hidden"
      );

      hideMessage();

      codeInput.focus();

    }
  );

</script>

</body>
</html>
