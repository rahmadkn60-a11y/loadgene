<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LuaForge — GitHub Uploader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #08090d;
      --panel: rgba(18, 20, 28, 0.78);
      --panel-border: rgba(255, 255, 255, 0.09);
      --text: #f5f7fb;
      --muted: #9298a8;
      --accent: #7c5cff;
      --accent-2: #9d87ff;
      --success: #39d98a;
      --danger: #ff5c70;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(124, 92, 255, 0.16),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(74, 144, 226, 0.10),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      padding: 32px 18px;
    }

    .container {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    /* HEADER */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 13px;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #4f3dbb
        );

      box-shadow:
        0 10px 35px rgba(124, 92, 255, 0.25);

      font-size: 20px;
      font-weight: 900;
    }

    .brand h1 {
      font-size: 20px;
      letter-spacing: -0.5px;
    }

    .brand p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 8px 12px;

      border: 1px solid var(--panel-border);
      background: rgba(255,255,255,0.035);
      border-radius: 999px;

      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 12px rgba(57, 217, 138, 0.8);
    }

    /* MAIN PANEL */

    .panel {
      border: 1px solid var(--panel-border);
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-radius: 22px;

      box-shadow:
        0 30px 80px rgba(0,0,0,0.35);

      overflow: hidden;
    }

    .panel-header {
      padding: 22px 24px;

      border-bottom: 1px solid var(--panel-border);

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
    }

    .panel-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .language {
      padding: 7px 11px;
      border-radius: 8px;

      background: rgba(124, 92, 255, 0.10);
      color: var(--accent-2);

      font-size: 11px;
      font-weight: 700;

      border: 1px solid rgba(124, 92, 255, 0.18);
    }

    /* EDITOR */

    .editor-wrap {
      padding: 20px;
    }

    textarea {
      width: 100%;
      min-height: 430px;

      resize: vertical;

      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 15px;

      background:
        linear-gradient(
          180deg,
          rgba(5,6,10,0.94),
          rgba(10,11,17,0.94)
        );

      color: #e8eaff;

      padding: 20px;

      outline: none;

      font-family:
        "JetBrains Mono",
        "Fira Code",
        Consolas,
        monospace;

      font-size: 13px;
      line-height: 1.7;

      tab-size: 2;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    textarea:focus {
      border-color: rgba(124, 92, 255, 0.55);

      box-shadow:
        0 0 0 4px rgba(124, 92, 255, 0.08);
    }

    textarea::placeholder {
      color: #555b6c;
    }

    /* OPTIONS */

    .options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;

      margin-top: 14px;
    }

    .option {
      padding: 15px;

      border-radius: 13px;

      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.07);
    }

    .option-label {
      display: block;
      color: #d9dce7;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .option-value {
      color: var(--muted);
      font-size: 12px;
    }

    /* BUTTON */

    .actions {
      display: flex;
      gap: 10px;

      margin-top: 18px;
    }

    button {
      border: 0;
      cursor: pointer;

      border-radius: 12px;

      padding: 13px 19px;

      font-size: 13px;
      font-weight: 750;

      transition:
        transform 0.15s,
        opacity 0.15s,
        box-shadow 0.15s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .convert-btn {
      flex: 1;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #5f48db
        );

      box-shadow:
        0 12px 28px rgba(124, 92, 255, 0.22);
    }

    .convert-btn:hover {
      box-shadow:
        0 16px 35px rgba(124, 92, 255, 0.30);
    }

    .clear-btn {
      color: #d5d8e2;
      background: rgba(255,255,255,0.06);

      border: 1px solid rgba(255,255,255,0.08);
    }

    /* RESULT */

    .result {
      margin-top: 18px;

      padding: 18px;

      border-radius: 15px;

      background: rgba(57, 217, 138, 0.045);
      border: 1px solid rgba(57, 217, 138, 0.12);
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 12px;
    }

    .result-title {
      font-size: 12px;
      font-weight: 750;
    }

    .copy-btn {
      padding: 8px 12px;

      background: rgba(255,255,255,0.07);
      color: #e7e9f0;

      border: 1px solid rgba(255,255,255,0.08);

      font-size: 11px;
    }

    .result-code {
      overflow-x: auto;

      padding: 14px;

      border-radius: 10px;

      background: rgba(0,0,0,0.28);

      color: #bdeed4;

      font-family:
        "JetBrains Mono",
        "Fira Code",
        Consolas,
        monospace;

      font-size: 12px;
      line-height: 1.6;

      white-space: pre-wrap;
      word-break: break-all;
    }

    .hidden {
      display: none;
    }

    /* FOOTER */

    footer {
      text-align: center;

      color: #626878;

      font-size: 11px;

      margin-top: 18px;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      body {
        padding: 18px 12px;
      }

      header {
        align-items: flex-start;
      }

      .status {
        display: none;
      }

      .panel-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .options {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }

      .convert-btn {
        flex: none;
      }

      textarea {
        min-height: 330px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>

      <div class="brand">

        <div class="logo">
          LF
        </div>

        <div>
          <h1>LuaForge</h1>
          <p>GitHub Lua/Luau uploader</p>
        </div>

      </div>

      <div class="status">
        <span class="status-dot"></span>
        System ready
      </div>

    </header>


    <main class="panel">

      <div class="panel-header">

        <div>
          <div class="panel-title">
            Source Code
          </div>

          <div class="panel-subtitle">
            Paste your Lua/Luau source code below.
          </div>
        </div>

        <div class="language">
          LUA / LUAU
        </div>

      </div>


      <div class="editor-wrap">

        <textarea
          id="codeInput"
          spellcheck="false"
          placeholder="-- Paste your Lua / Luau code here...

print(&quot;Hello, World!&quot;)
"></textarea>


        <div class="options">

          <div class="option">
            <span class="option-label">
              Upload
            </span>

            <span class="option-value">
              GitHub repository
            </span>
          </div>

          <div class="option">
            <span class="option-label">
              Filename
            </span>

            <span class="option-value">
              Automatically generated
            </span>
          </div>

        </div>


        <div class="actions">

          <button
            class="convert-btn"
            id="convertButton"
          >
            Convert & Upload
          </button>

          <button
            class="clear-btn"
            id="clearButton"
          >
            Clear
          </button>

        </div>


        <div
          class="result hidden"
          id="resultBox"
        >

          <div class="result-head">

            <div class="result-title">
              Generated Loadstring
            </div>

            <button
              class="copy-btn"
              id="copyButton"
            >
              Copy
            </button>

          </div>

          <div
            class="result-code"
            id="resultCode"
          ></div>

        </div>

      </div>

    </main>


    <footer>
      LuaForge · GitHub-powered source uploader
    </footer>

  </div>


  <script>
    const codeInput =
      document.getElementById("codeInput");

    const convertButton =
      document.getElementById("convertButton");

    const clearButton =
      document.getElementById("clearButton");

    const copyButton =
      document.getElementById("copyButton");

    const resultBox =
      document.getElementById("resultBox");

    const resultCode =
      document.getElementById("resultCode");


    clearButton.addEventListener("click", () => {

      codeInput.value = "";

      resultBox.classList.add("hidden");

      resultCode.textContent = "";

      codeInput.focus();

    });


    convertButton.addEventListener("click", () => {

      const code =
        codeInput.value.trim();

      if (!code) {

        alert("Masukkan kode Lua/Luau terlebih dahulu.");

        codeInput.focus();

        return;
      }

      /*
       * Backend Cloudflare Worker akan
       * dipasang pada tahap berikutnya.
       *
       * Untuk sekarang kita hanya
       * menampilkan placeholder.
       */

      resultCode.textContent =
        "Backend belum terhubung.";

      resultBox.classList.remove("hidden");

    });


    copyButton.addEventListener("click", async () => {

      const text =
        resultCode.textContent;

      if (!text) return;

      try {

        await navigator.clipboard.writeText(text);

        copyButton.textContent = "Copied!";

        setTimeout(() => {

          copyButton.textContent = "Copy";

        }, 1500);

      } catch (error) {

        alert(
          "Clipboard tidak tersedia di browser ini."
        );

      }

    });
  </script>

</body>
</html>
